<style>
        body { font-family: 'Inter', sans-serif; }

            box-shadow: 0 0 15px #0044a3;

        }

<script>

        // Subtle animation for OTP boxes on load
        window.addEventListener('DOMContentLoaded', () => {
            const otpParts = document.querySelectorAll('.font-headline-md.text-headline-md.text-primary');
            otpParts.forEach((part, index) => {
                part.style.opacity = '0';
                part.style.transform = 'translateY(10px)';
                setTimeout(() => {
                    part.style.transition = 'all 0.4s ease';
                    part.style.opacity = '1';
                    part.style.transform = 'translateY(0)';
                }, 400 + (index * 200));
            });
        });
