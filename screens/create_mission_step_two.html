<script>
        function selectTime(element) {
            // Reset all cards
            document.querySelectorAll('.time-card').forEach(card => {
                card.classList.remove('bg-primary', 'text-white', 'border-primary', 'shadow-md');
                card.classList.add('bg-surface-container-lowest', 'text-on-surface', 'border-outline-variant');
                const icon = card.querySelector('.material-symbols-outlined');
                icon.classList.remove('text-white');
                icon.classList.add('text-on-surface-variant');
            });

            // Set active card
            element.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'border-outline-variant');
            element.classList.add('bg-primary', 'text-white', 'border-primary', 'shadow-md');
            const icon = element.querySelector('.material-symbols-outlined');
            icon.classList.remove('text-on-surface-variant');
            icon.classList.add('text-white');

            // Handle visibility of scheduled details
            const scheduleDetails = document.getElementById('scheduled-details');
            if (element.innerText.includes('Agendar')) {
                scheduleDetails.classList.remove('hidden');
            } else {
                scheduleDetails.classList.add('hidden');
            }
        }
    </script>
