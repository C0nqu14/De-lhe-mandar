<script>
        // Trigger confetti micro-interaction for extra celebration
        function createConfetti() {
            const container = document.body;
            const colors = ['#ff8928', '#1e5cc8', '#ffb786', '#b0c6ff'];
            for (let i = 0; i < 40; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'absolute w-2 h-2 rounded-full pointer-events-none z-0';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                container.appendChild(confetti);

                const duration = 2 + Math.random() * 3;
                confetti.animate([
                    { transform: `translate(0, 0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate(${Math.random() * 100 - 50}px, 100vh) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                ], {
                    duration: duration * 1000,
                    easing: 'cubic-bezier(0, 0, 0.2, 1)',
                    fill: 'forwards'
                });

                setTimeout(() => confetti.remove(), duration * 1000);
            }
        }

        window.addEventListener('load', () => {
            setTimeout(createConfetti, 400);
        });
    </script>
