<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-background docked full-width top-0 z-50 border-b border-outline-variant/50 shadow-sm dark:shadow-none flex items-center justify-between px-container-padding-mobile py-2 w-full max-w-full">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform p-2">

</button>
<h1 class="font-headline-md text-headline-md-mobile dark:text-on-background font-bold text-primary dark:text-primary-fixed">De Lhe Mandar</h1>
</div>
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container-highest">
<img alt="User profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuArc2mzoYkXcihRaOvX7OoiPrFqV0zYbuC-hlTTd3hrGkRlnapUZeMLuQXUzM-FMfXPU5kwOqnH-CURKZ0piiPMTw140GiFkkJjtfBXxSN2Chaa7FAyjEWVW0a0CXxmsaB2vy7gBhAMlwFOlJwL2RaSWpzei7sPp4VQcrBwb8mCkEmNdTZY6Oh6PHXUt9xTZti2weU_V8yHU168l1dt1nuLSjOFf3UMX8_5nAGHRefOXkO7oYgpfqSo">

</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-[1140px] mx-auto px-container-padding-mobile md:px-container-padding-desktop pt-stack-lg pb-32">
<!-- Progress Bar Section -->
<div class="mb-stack-lg">
<div class="flex justify-between items-center mb-2">
<span class="font-label-sm text-label-sm text-on-surface-variant">Etapa 3 de 6</span>
<span class="font-label-sm text-label-sm text-primary font-bold">Agendamento</span>
</div>
<div class="h-2 w-full bg-surface-container rounded-full overflow-hidden flex gap-1">
<div class="h-full w-1/6 step-active rounded-full"></div>
<div class="h-full w-1/6 step-active rounded-full"></div>
<div class="h-full w-1/6 step-active rounded-full"></div>
<div class="h-full w-1/6 step-inactive rounded-full"></div>
<div class="h-full w-1/6 step-inactive rounded-full"></div>
<div class="h-full w-1/6 step-inactive rounded-full"></div>
</div>
</div>
<div class="max-w-xl mx-auto space-y-stack-lg">
<div class="text-center">
<h2 class="font-headline-lg text-headline-lg-mobile text-on-surface mb-stack-sm">Quando?</h2>
<p class="font-body-md text-on-surface-variant">Escolha o melhor momento para realizar a sua missão.</p>
</div>
<div class="space-y-4">
<!-- Option: Now -->
<div class="method-card">
<input checked="" class="hidden" id="agora" name="schedule_type" type="radio">
<label class="flex items-center justify-between p-6 bg-surface-container-lowest border border-outline-variant rounded-2xl cursor-pointer transition-all hover:bg-surface-container-low shadow-sm" for="agora">
<div class="flex items-center gap-5">
<div class="bg-primary/10 w-14 h-14 rounded-2xl flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
<div>
<p class="font-headline-md text-on-surface">Agora</p>
<p class="font-body-md text-on-surface-variant">O mais breve possível</p>
</div>
</div>
<span class="material-symbols-outlined text-primary check-circle opacity-0 transition-opacity text-2xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</label>
</div>
<!-- Option: Schedule -->
<div class="method-card">
<input class="hidden" id="agendar" name="schedule_type" type="radio">
<label class="flex items-center justify-between p-6 bg-surface-container-lowest border border-outline-variant rounded-2xl cursor-pointer transition-all hover:bg-surface-container-low shadow-sm" for="agendar">

<div class="bg-secondary-container/10 w-14 h-14 rounded-2xl flex items-center justify-center text-secondary">

</div>

</div>
</div>
<span class="material-symbols-outlined text-primary check-circle opacity-0 transition-opacity text-2xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</label>
</div>
</div>
<!-- Date/Time Picker (Hidden by default, shown when 'Agendar' is selected) -->
<div class="hidden animate-in fade-in slide-in-from-top-4 duration-300 space-y-4" id="datetime-picker">
<div class="bg-surface-container-low p-6 rounded-2xl border border-outline-variant/50">

<div class="space-y-2">

</div>
<div class="space-y-2">
<label class="font-label-sm text-on-surface-variant uppercase">Hora</label>
<input class="w-full bg-surface-container-lowest border-outline-variant rounded-xl p-3 focus:ring-primary focus:border-primary" type="time">
</div>
</div>
</div>
</div>
<div class="pt-stack-lg">
<button class="w-full bg-secondary-container text-on-secondary-container hover:bg-secondary-container/90 active:scale-[0.98] transition-all py-4 rounded-full font-headline-md text-headline-md font-bold shadow-lg shadow-secondary-container/20" onclick="window.location.href='{{DATA:SCREEN:SCREEN_5}}'">
                    Continuar
                </button>
<p class="text-center mt-stack-md font-label-sm text-label-sm text-outline">
                    Passo 3 de 6: Definindo o horário.
                </p>
</div>
</div>
</main>
<script>
        const radioAgendar = document.getElementById('agendar');
        const radioAgora = document.getElementById('agora');
        const picker = document.getElementById('datetime-picker');

        radioAgendar.addEventListener('change', () => {
            if (radioAgendar.checked) {
                picker.classList.remove('hidden');
            }
        });

        radioAgora.addEventListener('change', () => {
            if (radioAgora.checked) {
                picker.classList.add('hidden');
            }
        });

        document.querySelector('button.bg-secondary-container').addEventListener('click', function() {
            const btn = this;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="flex items-center justify-center gap-2"><svg class="animate-spin h-5 w-5 text-on-secondary-container" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Processando...</span>';
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
                alert('Horário definido com sucesso! Avançando para a próxima etapa.');
            }, 800);
        });
    </script>
