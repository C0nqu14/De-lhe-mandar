<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcf9f8;
            -webkit-tap-highlight-color: transparent;
            min-height: max(884px, 100dvh);
        }
        .step-container {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }
        .step-container.active {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .progress-bar {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .currency-input:focus-within {
            border-color: #0044a3;
            box-shadow: 0 0 0 1px #0044a3;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>

<body class="min-h-screen flex flex-col text-on-surface">
<!-- TopAppBar -->
<header class="bg-surface docked full-width top-0 z-50 border-b border-outline-variant/50 shadow-sm flex items-center justify-between px-container-padding-mobile py-2 w-full max-w-full sticky">
<button class="p-2 active:scale-95 transition-transform text-primary" onclick="prevStep()">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile font-bold text-primary">De Lhe Mandar</h1>
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center overflow-hidden border border-outline-variant/30">
<img alt="Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCZ0RM3LI5fXhPN6MalcvwoypBo4m_N-wWbcZRMal_59a9uZusZyj7webK4FrvHab8RnFMwHUyWAHaNaD7n-HUDDT3X07MQPS46U2UI5i_rEYBewom5jdoEYtfYMrhmEFJ2nW8rUUNXPOfgDPdtKnUTS6YoxXzSZq6KuyaZuAhRofq5gGCDJGpwJeZr2PasyhRyTxvYG-S3n8yqmvZGII7ASPGopH1fSp_MZxOSGJVRDcpFLhfyEACC">
</div>
</header>
<!-- Progress Indicator -->
<div class="w-full bg-surface-container-low h-1.5 sticky top-[56px] z-40">
<div class="progress-bar bg-primary h-full rounded-r-full" id="progress" style="width: 100%;"></div>
</div>
<main class="flex-grow flex flex-col items-center justify-center px-container-padding-mobile py-stack-lg max-w-2xl mx-auto w-full">
<!-- Step 6: Service Payment (Active by default for this view) -->
<section class="step-container active flex-col w-full" id="step6">
<div class="mb-stack-lg text-center">
<span class="inline-block px-3 py-1 bg-primary/10 text-primary rounded-full font-label-sm text-label-sm mb-base">Passo 6 de 6</span>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Quanto oferece pelo serviço?</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Este é o pagamento líquido para quem realizar a sua missão. Seja justo para atrair bons executores.</p>
</div>
<div class="w-full space-y-6">
<!-- Main Currency Input -->
<div class="currency-input bg-surface-container-lowest border-2 border-outline-variant rounded-2xl p-6 flex items-center h-24 transition-all focus-within:border-primary">
<span class="font-headline-md text-headline-md text-outline mr-4">Kz</span>
<input class="w-full bg-transparent border-none focus:ring-0 font-headline-xl text-headline-xl text-primary placeholder:text-outline/30" id="service_offer" oninput="calculateTotals()" pattern="\d*" placeholder="0" type="number">
</div>
<!-- Suggested Amounts -->
<div class="grid grid-cols-3 gap-base">
<button class="py-4 px-2 rounded-xl border border-outline-variant/30 font-label-md text-label-md hover:bg-primary/5 hover:border-primary/50 transition-all active:scale-95 cursor-pointer" onclick="setOffer(2000)">2.000 Kz</button>
<button class="py-4 px-2 rounded-xl border border-outline-variant/30 font-label-md text-label-md hover:bg-primary/5 hover:border-primary/50 transition-all active:scale-95 cursor-pointer" onclick="setOffer(5000)">5.000 Kz</button>
<button class="py-4 px-2 rounded-xl border border-outline-variant/30 font-label-md text-label-md hover:bg-primary/5 hover:border-primary/50 transition-all active:scale-95 cursor-pointer" onclick="setOffer(10000)">10.000 Kz</button>
</div>
<!-- Summary Card -->
<div class="bg-surface-container-low p-gutter rounded-3xl border border-outline-variant/20 shadow-sm">

</div>
<div class="pt-4 border-t border-outline-variant/30">
<div class="flex justify-between items-end">
<div>
<span class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Total a Pagar</span>
<span class="font-headline-md text-headline-md text-on-surface font-bold" id="total_amount">0 Kz</span>
</div>
<div class="text-right">
<span class="material-symbols-outlined text-primary text-3xl">verified_user</span>
</div>
</div>
</div>
</div>
</div>

<span class="material-symbols-outlined text-secondary text-sm">lock</span>
<p class="font-label-sm text-label-sm text-on-secondary-container">Pagamento seguro processado após conclusão da missão.</p>
</div>
</div>
</section>
<!-- Hidden steps for logic persistence -->
<section class="step-container flex-col w-full" id="step5">
<input id="estimated_value" type="hidden" value="0">
</section>
</main>
<!-- Action Bar -->
<footer class="p-container-padding-mobile bg-surface-container-lowest border-t border-outline-variant/30 flex gap-gutter safe-area-bottom sticky bottom-0 z-50">
<button class="flex-1 py-4 font-label-md text-label-md text-primary border border-primary rounded-full hover:bg-primary/5 transition-colors" id="prevBtn" onclick="prevStep()">
            Anterior
        </button>
<button class="flex-[2] py-4 font-label-md text-label-md text-white bg-primary rounded-full hover:bg-primary-container transition-all shadow-lg shadow-primary/20 disabled:opacity-50 disabled:grayscale" disabled="" id="nextBtn" onclick="window.location.href='{{DATA:SCREEN:SCREEN_6}}'">
            Publicar Missão
        </button>
</footer>
<script>
        let currentStep = 6;
        const totalSteps = 6;

        function updateProgress() {
            const progressPercent = (currentStep / totalSteps) * 100;
            document.getElementById('progress').style.width = progressPercent + '%';
            checkValidity();
        }

        function setOffer(amount) {
            const input = document.getElementById('service_offer');
            input.value = amount;
            calculateTotals();
        }

        function calculateTotals() {
            const offer = parseFloat(document.getElementById('service_offer').value) || 0;
            const estimated = parseFloat(document.getElementById('estimated_value').value) || 0;
            const tax = offer * 0.1;
            const total = offer + tax + estimated;

            document.getElementById('tax_amount').innerText = tax.toLocaleString('pt-AO') + ' Kz';
            document.getElementById('total_amount').innerText = total.toLocaleString('pt-AO') + ' Kz';
            
            checkValidity();
        }

        function checkValidity() {
            const offer = parseFloat(document.getElementById('service_offer').value) || 0;
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.disabled = offer <= 0;
        }

        function publishMission() {
            const offer = document.getElementById('service_offer').value;
            alert(`Missão publicada com sucesso! Oferta de ${offer} Kz registada.`);
        }

        function prevStep() {
            // Simplified navigation for this demo view
            window.history.back();
        }

        // Initialize
        updateProgress();
    </script>


</body></html>
