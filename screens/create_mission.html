          },

<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .step-indicator-active { width: 40px; }
        .chip-active {
            background-color: #0044a3;
            color: white;
            border-color: #0044a3;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="bg-surface border-b border-outline-variant/50 shadow-sm docked full-width top-0 z-50 flex items-center justify-between px-container-padding-mobile py-2 w-full max-w-full">
<div class="flex items-center gap-4">
<button aria-label="Voltar" class="active:scale-95 transition-transform p-2 hover:bg-surface-container-low transition-colors rounded-full">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">De Lhe Mandar</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-highest overflow-hidden border border-outline-variant">
<img alt="User Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCRqD8xVjbsP1fz8acGkplvIxtwpO8NTR6ekZGaXdgmtb1USM_s3ECfsHcrRWc3lv0zELF89_SBtuWZa2RYig_IsK4E9z3KvgtdBMjDkF7pfvISjllOqb7eeJ55N-Q6FGaW8zZoCW2DChsv51yyK2qqcT3iroH2pf2nv82TMvFQ-hhszfmxnGYduR1i0Vx6DB97f4PPS2KQqTjNS14mg9m7hGD1wmZqEJ8d-cE5z3tVphFdgD8oyh8X">
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 max-w-xl mx-auto w-full px-container-padding-mobile py-stack-lg flex flex-col">
<!-- Step Progress Indicator: 1 of 6 -->
<div class="flex items-center gap-1.5 mb-stack-lg">
<div class="h-1.5 step-indicator-active bg-primary rounded-full transition-all duration-500"></div>
<div class="h-1.5 w-6 bg-surface-container-highest rounded-full"></div>
<div class="h-1.5 w-6 bg-surface-container-highest rounded-full"></div>
<div class="h-1.5 w-6 bg-surface-container-highest rounded-full"></div>
<div class="h-1.5 w-6 bg-surface-container-highest rounded-full"></div>
<div class="h-1.5 w-6 bg-surface-container-highest rounded-full"></div>
<span class="ml-auto font-label-sm text-label-sm text-on-surface-variant">Passo 1 de 6</span>
</div>
<!-- Question Header -->
<div class="mb-stack-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">O que precisa?</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Descreva a missão que deseja que alguém realize por si.</p>
</div>
<!-- Multi-step Form Content -->
<section class="flex flex-col gap-stack-lg flex-1">
<!-- Description Input -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface" for="mission-description">Descrição da Missão</label>
<textarea class="w-full p-4 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary transition-all resize-none placeholder:text-outline" id="mission-description" placeholder="Ex: Comprar botija de gás e entregar em casa." rows="6"></textarea>
</div>
<!-- Category Selection Chips -->
<div class="space-y-4">
<label class="font-label-md text-label-md text-on-surface">Selecione uma categoria</label>
<div class="flex flex-wrap gap-2">
<!-- Category Chips -->
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface-container-low text-on-surface-variant font-label-md text-label-md hover:bg-surface-container hover:border-outline transition-colors chip-active cursor-pointer">
                        Compras
                    </button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface-container-low text-on-surface-variant font-label-md text-label-md hover:bg-surface-container hover:border-outline transition-colors cursor-pointer">
                        Entregas
                    </button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface-container-low text-on-surface-variant font-label-md text-label-md hover:bg-surface-container hover:border-outline transition-colors cursor-pointer">
                        Limpeza
                    </button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface-container-low text-on-surface-variant font-label-md text-label-md hover:bg-surface-container hover:border-outline transition-colors cursor-pointer">
                        Reparações
                    </button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface-container-low text-on-surface-variant font-label-md text-label-md hover:bg-surface-container hover:border-outline transition-colors cursor-pointer">
                        Recados
                    </button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface-container-low text-on-surface-variant font-label-md text-label-md hover:bg-surface-container hover:border-outline transition-colors cursor-pointer">
                        Outros
                    </button>
</div>
</div>
<!-- Contextual Dica de Sucesso Card -->
<div class="mt-auto pt-stack-lg">
<div class="bg-surface-container-low p-4 rounded-2xl flex items-start gap-4 border border-outline-variant/30">
<div class="p-3 bg-primary/10 rounded-xl">
<span class="material-symbols-outlined text-primary">lightbulb</span>
</div>
<div>
<p class="font-label-md text-label-md text-primary font-bold">Dica de Sucesso</p>
<p class="font-body-md text-body-md text-on-surface-variant text-sm mt-0.5 leading-relaxed">Missões bem detalhadas são aceites 2x mais rápido. Inclua horários e referências visuais se possível.</p>
</div>
</div>
</div>
</section>
<!-- Fixed Bottom Action Bar -->
<footer class="mt-stack-lg pt-4">
<button class="w-full h-14 bg-secondary-container hover:bg-secondary transition-colors text-on-secondary-container font-bold rounded-full flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-lg shadow-secondary-container/20 cursor-pointer" onclick="window.location.href='{{DATA:SCREEN:SCREEN_8}}'">
<span class="font-label-md text-label-md">Continuar</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</footer>
</main>
<script>
        // Micro-interactions for chip selection
        const chips = document.querySelectorAll('.flex-wrap button');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => c.classList.remove('chip-active'));
                chip.classList.add('chip-active');
            });
        });

        // Simple button interaction feedback
        const nextBtn = document.querySelector('footer button');
        nextBtn.addEventListener('click', () => {
            nextBtn.classList.add('opacity-90');
            setTimeout(() => {
                nextBtn.classList.remove('opacity-90');
            }, 200);
        });
    </script>


</body></html>
